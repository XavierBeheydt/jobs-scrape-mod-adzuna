[project]
name = "jobs-scrape-mod-adzuna"
version = "0.1.0"
description = "Collecteur jobs-scrape pour Adzuna (agregateur, France et Suisse)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Xavier Beheydt", email = "xavier.beheydt@gmail.com" }]

dependencies = ["jobs-scrape>=0.1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.entry-points."jobs_scrape.sources"]
adzuna = "jobs_scrape_mod_adzuna:SOURCE"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobs_scrape_mod_adzuna"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
